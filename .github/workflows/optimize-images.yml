# When Iza uploads an artwork (Pages CMS or GitHub), shrink heavy photos automatically.
name: Optimizar imágenes

on:
  push:
    branches: [main]
    paths: ['images/obras/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python .github/scripts/optimize_images.py images/obras
      - name: Commit optimized images
        run: |
          if [ -n "$(git status --porcelain images/obras)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images/obras
            git commit -m "chore: optimizar imágenes de obras"
            git pull --rebase origin main
            git push
          fi
